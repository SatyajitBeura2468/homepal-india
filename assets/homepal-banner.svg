<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">HomePal — Your home, taken care of</title><desc id="desc">An animated forest-green HomePal banner with a little house illustration and floating home-management cards.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174d3b"/><stop offset=".56" stop-color="#0c3b2e"/><stop offset="1" stop-color="#071f19"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ffe0"/><stop offset="1" stop-color="#86dfb5"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".055"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00150f" flood-opacity=".35"/></filter>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#d7ffe8" stroke-opacity=".055"/></pattern>
</defs>
<rect width="1440" height="470" rx="38" fill="url(#bg)"/><rect width="1440" height="470" rx="38" fill="url(#grid)"/>
<circle cx="1234" cy="56" r="170" fill="#a7f0c8" opacity=".08"><animate attributeName="r" values="160;185;160" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="1320" cy="420" r="215" fill="#d8b4fe" opacity=".07"><animate attributeName="cy" values="420;394;420" dur="11s" repeatCount="indefinite"/></circle>
<path d="M0 392C174 356 272 441 434 409S722 363 865 419s260 15 360-20 160-15 215-2V470H0Z" fill="#a7f0c8" opacity=".05"/>
