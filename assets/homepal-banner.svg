 <path d="M10 28 28 12 46 28M16 25v19h24V25" fill="none" stroke="#0c3b2e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M28 43c-5-3.3-5-8.5 0-12 5 3.5 5 8.7 0 12Z" fill="#d89d35"/>
</g>
<text x="151" y="90" fill="#bdf6d7" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4">A LITTLE MORE PEACE OF MIND</text>
<text x="76" y="206" fill="#f3efe6" font-family="Arial,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">HomePal</text>
<text x="80" y="269" fill="#a7f0c8" font-family="Georgia,serif" font-size="39" font-style="italic">Your home, taken care of.</text>
<text x="80" y="319" fill="#d7e8de" font-family="Arial,sans-serif" font-size="21">The little details of home, finally in one place.</text>
