 <rect x="167" width="158" height="43" rx="21.5" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".18"/><text x="246" y="27" text-anchor="middle" fill="#f3efe6" font-family="Arial,sans-serif" font-weight="700" font-size="15">HOME CARE</text>
