<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">HomePal interface preview</title><desc id="desc">A designed preview of the HomePal dashboard with home-care tasks, records, and recipe cards.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7e5db"/><stop offset="1" stop-color="#f8f6ee"/></linearGradient><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17614a"/><stop offset="1" stop-color="#08271f"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8d792"/><stop offset="1" stop-color="#a7f0c8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#14392b" flood-opacity=".12"/></filter></defs>
<rect width="1440" height="980" rx="34" fill="url(#bg)"/>
<text x="82" y="78" fill="#0f3d2e" font-family="Arial,sans-serif" font-size="19" font-weight="800" letter-spacing="4">HOMEPAL</text>
<text x="1358" y="78" text-anchor="end" fill="#5f6a64" font-family="Arial,sans-serif" font-size="15">A calmer home starts here</text>
<rect x="62" y="112" width="1316" height="470" rx="34" fill="url(#hero)"/>
<circle cx="1190" cy="190" r="190" fill="#a7f0c8" opacity=".08"><animate attributeName="r" values="170;200;170" dur="10s" repeatCount="indefinite"/></circle>
<text x="106" y="171" fill="#a7f0c8" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">GOOD MORNING, GREEN PARK</text>
<text x="106" y="248" fill="#f3efe6" font-family="Arial,sans-serif" font-size="52" font-weight="800">Your home,</text>
<text x="106" y="307" fill="#a7f0c8" font-family="Georgia,serif" font-style="italic" font-size="57">taken care of.</text>
<text x="106" y="356" fill="#d7e8de" font-family="Arial,sans-serif" font-size="19">The everyday details, all in one quiet place.</text>
<rect x="106" y="391" width="176" height="53" rx="26.5" fill="#a7f0c8"/><text x="194" y="424" text-anchor="middle" fill="#0c3b2e" font-family="Arial,sans-serif" font-weight="800" font-size="16">+ ADD TO HOME</text>
<rect x="296" y="391" width="128" height="53" rx="26.5" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".4"/><text x="360" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-weight="700" font-size="16">SEARCH</text>
<g transform="translate(107 477)"><path d="M0 0H500" stroke="#ffffff" stroke-opacity=".22"/><g font-family="Arial,sans-serif"><text x="0" y="34" fill="#ffffff" font-size="26" font-weight="800">04</text><text x="0" y="54" fill="#d7e8de" font-size="12">RECORDS</text><text x="145" y="34" fill="#ffffff" font-size="26" font-weight="800">02</text><text x="145" y="54" fill="#d7e8de" font-size="12">APPLIANCES</text><text x="295" y="34" fill="#ffffff" font-size="26" font-weight="800">03</text><text x="295" y="54" fill="#d7e8de" font-size="12">TASKS</text><text x="430" y="34" fill="#ffffff" font-size="26" font-weight="800">06</text><text x="430" y="54" fill="#d7e8de" font-size="12">RECIPES</text></g></g>
<g transform="translate(820 155)">
 <rect width="474" height="356" rx="26" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".16"/>
 <rect x="32" y="31" width="410" height="78" rx="18" fill="#ffffff" fill-opacity=".08"/>
 <path d="M55 63h25l10-11 18 22 12-13h28" fill="none" stroke="#a7f0c8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="175" y="63" fill="#f3efe6" font-family="Arial,sans-serif" font-size="15" font-weight="700">Keep the small things</text><text x="175" y="86" fill="#cfe4d8" font-family="Arial,sans-serif" font-size="14">from becoming big things.</text>
 <g transform="translate(32 131)"><rect width="410" height="58" rx="14" fill="#ffffff" fill-opacity=".06"/><circle cx="24" cy="29" r="10" fill="#a7f0c8"/><path d="m19 29 4 4 7-8" fill="none" stroke="#0c3b2e" stroke-width="2" stroke-linecap="round"/><text x="49" y="25" fill="#f3efe6" font-family="Arial,sans-serif" font-size="15" font-weight="700">Check water filter</text><text x="49" y="44" fill="#cfe4d8" font-family="Arial,sans-serif" font-size="12">Home care · Due this week</text><rect x="321" y="18" width="68" height="23" rx="11.5" fill="#f4cf83" fill-opacity=".16"/><text x="355" y="34" text-anchor="middle" fill="#f4cf83" font-family="Arial,sans-serif" font-size="11" font-weight="700">UPCOMING</text></g>
 <g transform="translate(32 201)"><rect width="410" height="58" rx="14" fill="#ffffff" fill-opacity=".06"/><circle cx="24" cy="29" r="10" fill="#d8b4fe"/><path d="M19 29h10M24 24v10" stroke="#35194a" stroke-width="2" stroke-linecap="round"/><text x="49" y="25" fill="#f3efe6" font-family="Arial,sans-serif" font-size="15" font-weight="700">Review rental agreement</text><text x="49" y="44" fill="#cfe4d8" font-family="Arial,sans-serif" font-size="12">Records · Saved securely on-device</text></g>
 <g transform="translate(32 271)"><rect width="410" height="58" rx="14" fill="#ffffff" fill-opacity=".06"/><circle cx="24" cy="29" r="10" fill="#f4cf83"/><path d="M24 22v7l5 3" fill="none" stroke="#6e4a11" stroke-width="2" stroke-linecap="round"/><text x="49" y="25" fill="#f3efe6" font-family="Arial,sans-serif" font-size="15" font-weight="700">Annual AC service</text><text x="49" y="44" fill="#cfe4d8" font-family="Arial,sans-serif" font-size="12">Appliances · Recurring task</text></g>
</g>
<g transform="translate(62 618)">
 <text x="0" y="0" fill="#0b1f19" font-family="Arial,sans-serif" font-size="29" font-weight="800">Everything has its place.</text>
 <text x="0" y="32" fill="#5f6a64" font-family="Arial,sans-serif" font-size="16">A few tidy spaces for the things your household relies on.</text>
 <g transform="translate(0 67)" filter="url(#shadow)">
  <rect width="308" height="210" rx="24" fill="#fbfaf6" stroke="#d9d5c9"/><rect x="0" y="0" width="308" height="100" rx="24" fill="#1b614a"/><rect x="0" y="75" width="308" height="25" fill="#1b614a"/><circle cx="255" cy="44" r="32" fill="#a7f0c8" opacity=".2"/><path d="M34 54 68 25 102 54M43 48v29h50V48" fill="none" stroke="#f3efe6" stroke-width="3" stroke-linejoin="round"/><text x="24" y="138" fill="#0b1f19" font-family="Arial,sans-serif" font-size="19" font-weight="800">Records</text><text x="24" y="166" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">Leases, receipts, warranties</text><text x="24" y="187" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">and useful files.</text>
  <rect x="334" width="308" height="210" rx="24" fill="#fbfaf6" stroke="#d9d5c9"/><rect x="334" width="308" height="100" rx="24" fill="#372047"/><rect x="334" y="75" width="308" height="25" fill="#372047"/><circle cx="588" cy="45" r="30" fill="#d8b4fe" opacity=".2"/><path d="M378 36h28a8 8 0 0 1 8 8v35h-44V44a8 8 0 0 1 8-8Z" fill="none" stroke="#f3efe6" stroke-width="3"/><path d="M379 48h18M379 60h18" stroke="#d8b4fe" stroke-width="3" stroke-linecap="round"/><text x="358" y="138" fill="#0b1f19" font-family="Arial,sans-serif" font-size="19" font-weight="800">Home care</text><text x="358" y="166" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">Appliance details, service</text><text x="358" y="187" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">history and recurring tasks.</text>
  <rect x="668" width="308" height="210" rx="24" fill="#fbfaf6" stroke="#d9d5c9"/><rect x="668" width="308" height="100" rx="24" fill="#16224a"/><rect x="668" y="75" width="308" height="25" fill="#16224a"/><circle cx="923" cy="45" r="32" fill="#8fb0ff" opacity=".2"/><path d="M715 32v48M731 32v48M747 32v48M707 48h48M707 64h48" stroke="#f3efe6" stroke-width="3" stroke-linecap="round"/><text x="692" y="138" fill="#0b1f19" font-family="Arial,sans-serif" font-size="19" font-weight="800">Recipes</text><text x="692" y="166" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">Keep family favourites and</text><text x="692" y="187" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">scale them to your table.</text>
  <rect x="1002" width="314" height="210" rx="24" fill="#fbfaf6" stroke="#d9d5c9"/><rect x="1002" width="314" height="100" rx="24" fill="#0f3d2e"/><rect x="1002" y="75" width="314" height="25" fill="#0f3d2e"/><circle cx="1260" cy="45" r="32" fill="#f0a52b" opacity=".2"/><circle cx="1044" cy="53" r="22" fill="none" stroke="#a7f0c8" stroke-width="3"/><path d="M1044 41v13l9 6" fill="none" stroke="#a7f0c8" stroke-width="3" stroke-linecap="round"/><text x="1026" y="138" fill="#0b1f19" font-family="Arial,sans-serif" font-size="19" font-weight="800">Your routines</text><text x="1026" y="166" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">One list for what needs</text><text x="1026" y="187" fill="#5f6a64" font-family="Arial,sans-serif" font-size="14">doing next.</text>
 </g>
</g>
<text x="80" y="944" fill="#5f6a64" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">DESIGNED FOR THE EVERYDAY</text>
